<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔라 · Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --page-bg:#e9eaec;
    --card-bg:#fafaf9;
    --ink:#161513;
    --sub:#a3a19b;
    --line:#e7e5e0;
    --accent:#ff5b7a;
    --accent-soft:#ffe7ec;
    --pink-2:#ffd3dc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    background:var(--page-bg);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .app{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:28px;
    box-shadow:0 24px 60px rgba(20,18,15,.10), 0 2px 10px rgba(20,18,15,.05);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 96px);
    max-height:calc(100dvh - 96px);
  }
  .list{
    overflow-y:auto;
  }

  /* keep the card look on small screens too, just tighten the margins */
  @media (max-width:480px){
    body{padding:20px 12px;}
    .app{
      border-radius:20px;
      max-height:calc(100vh - 40px);
      max-height:calc(100dvh - 40px);
    }
  }

  /* ---------- header ---------- */
  .hero{
    padding:88px 32px 28px;
  }
  .avatar{
    width:44px;height:44px;
    border-radius:50%;
    overflow:hidden;
    background:#eeece7;
    margin-bottom:20px;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    color:var(--sub);
    text-transform:uppercase;
  }
  .hero p{
    margin:10px 0 0;
    font-size:13px;
    color:var(--sub);
    line-height:1.6;
    max-width:280px;
  }

  /* ---------- section label ---------- */
  .section-divider{
    height:1px;
    margin:4px 32px 0;
    background:var(--line);
  }
  .section-label{
    padding:20px 32px 10px;
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    letter-spacing:.04em;
  }

  /* ---------- conversation list ---------- */
  .list{
    padding:4px 20px 44px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .convo{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 12px;
    border-radius:18px;
    text-decoration:none;
    color:inherit;
    transition:background .18s ease, transform .18s ease;
    position:relative;
  }
  .convo:active{transform:scale(.98);}
  .convo:hover{background:#f3f1ec;}

  .convo-icon{
    flex-shrink:0;
    width:52px;height:52px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .icon-fromm{background:#fff; box-shadow:0 0 0 1px var(--line);}
  .icon-fromm img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .icon-bubble{background:#f3f0fb;}
  .icon-bubble img{
    width:66%; height:auto;
    object-fit:contain;
  }
  .icon-memo{background:#fff; box-shadow:0 0 0 1px var(--line);}
  .icon-memo img{
    width:100%; height:100%;
    object-fit:cover;
  }

  .convo-body{flex:1;min-width:0;}
  .convo-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .convo-name{
    font-size:15.5px;
    font-weight:700;
  }
  .convo-time{
    font-size:11px;
    color:var(--sub);
    flex-shrink:0;
  }
  .convo-preview{
    font-size:13px;
    color:var(--sub);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .convo-badge{
    flex-shrink:0;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--accent);
  }

  /* ---------- footer ---------- */
  footer{
    padding:0 32px 40px;
    font-size:11px;
    color:var(--sub);
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="app">

  <div class="hero">
    <div class="avatar"><img src="./assets/profile.jpg" alt="솔라"></div>
    <div class="label">Solar Archive</div>
    <p>버블과 프롬으로 남긴 메시지들을<br>이곳에 모아두었어요.</p>
  </div>

  <div class="section-divider"></div>
  <div class="section-label">대화 목록</div>

  <nav class="list">
    <a class="convo" href="./bubble/">
      <div class="convo-icon icon-bubble"><img src="./assets/bubble-logo.png" alt="Bubble"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">Bubble Archive</span>
          <span class="convo-time">열어보기</span>
        </div>
        <div class="convo-preview">그동안의 버블 메시지 모아보기 ›</div>
      </div>
      <span class="convo-badge"></span>
    </a>

    <a class="convo" href="./fromm/">
      <div class="convo-icon icon-fromm"><img src="./assets/fromm-logo.png" alt="FROMM"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">FROMM Archive</span>
          <span class="convo-time">열어보기</span>
        </div>
        <div class="convo-preview">프롬에서 보낸 편지들 모아보기 ›</div>
      </div>
      <span class="convo-badge"></span>
    </a>

    <a class="convo" href="./memo/">
      <div class="convo-icon icon-memo"><img src="./assets/memo-logo.png" alt="용줄메모" onerror="this.onerror=null;this.src='./assets/memo-logo.jpg';"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">용줄메모</span>
          <span class="convo-time">열어보기</span>
        </div>
        <div class="convo-preview">한줄메모에 남긴 용이만의 글 모아보기 ›</div>
      </div>
      <span class="convo-badge"></span>
    </a>
  </nav>

  <footer>yong-archive · since 2026</footer>

</div>

</body>
</html>
