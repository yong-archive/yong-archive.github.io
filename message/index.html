<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar · Message Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root{
    --page-bg:#ffffff;
    --card-bg:#ffffff;
    --ink:#161513;
    --sub:#a3a19b;
    --line:#e7e5e0;
    --accent:#ff5b7a;
    --accent-soft:#ffe7ec;
    --pink-2:#ffd3dc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    background:var(--page-bg);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  /* card layout: centers like the PC version on wider screens,
     and goes full-bleed on mobile via the media query below */
  .app{
    width:100%;
    max-width:380px;
    height:676px;
    max-height:calc(100vh - 96px);
    max-height:calc(100dvh - 96px);
    background:var(--card-bg);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 12px rgba(0,0,0,.12);
    border:0.5px solid #dedcd6;
    display:flex;
    flex-direction:column;
  }


  /* wraps hero + list together so the whole block centers vertically
     inside the card, instead of the list stretching to fill leftover
     space and everything reading as pinned to the top */
  .content{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    width:100%;
    margin:0;
    min-height:0;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(0,0,0,.18) transparent;
  }
  .content::-webkit-scrollbar{width:6px;}
  .content::-webkit-scrollbar-track{background:transparent;}
  .content::-webkit-scrollbar-thumb{background:#fff;border:1px solid rgba(0,0,0,.15);background-clip:padding-box;border-radius:999px;}
  .content::-webkit-scrollbar-thumb:hover{background:#fff;border-color:rgba(0,0,0,.28);}

  /* ---------- messenger-style header ---------- */
  .msg-header{ padding:44px 20px 10px; }

  .back-btn{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;color:var(--sub);text-decoration:none;
    margin-bottom:32px;
  }

  .profile-row{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:0;
    margin-left:12px;
  }
  .profile-icon{
    position:relative;
    width:52px;height:52px;
    border-radius:50%;
    overflow:hidden;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .profile-icon svg{ width:26px; height:26px; color:#c23f5a; }
  .profile-icon img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .profile-text{
    display:flex;
    flex-direction:column;
  }
  .profile-name{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .profile-sub{
    margin:4px 0 0;
    font-size:12px;
    color:var(--sub);
    line-height:1.5;
  }

  .thread-count{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:18px;
    margin-left:12px;
    padding:5px 10px;
    background:var(--accent-soft);
    border-radius:20px;
  }
  .thread-count svg{ flex-shrink:0; }
  .thread-count span{
    font-size:11.5px;
    font-weight:600;
    color:#c23f5a;
  }

  /* ---------- section label ---------- */
  .section-divider{
    height:1px;
    margin:14px 32px 0;
    background:var(--line);
  }
  .section-label{
    padding:20px 32px 10px;
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    letter-spacing:.04em;
  }

  /* ---------- conversation list ---------- */
  .list{
    padding:0 20px 32px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .convo{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 12px;
    border-radius:18px;
    text-decoration:none;
    color:inherit;
    transition:background .18s ease, transform .18s ease;
    position:relative;
  }
  .convo:active{transform:scale(.98);}
  .convo:hover{background:#f3f1ec;}

  .convo-icon{
    flex-shrink:0;
    width:46px;height:46px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .icon-fromm{background:#fff; box-shadow:0 0 0 1px var(--line);}
  .icon-fromm img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .icon-bubble{background:#f3f0fb;}
  .icon-bubble img{
    width:66%; height:auto;
    object-fit:contain;
  }
  .icon-memo{background:#fff; box-shadow:0 0 0 1px var(--line);}
  .icon-memo img{
    width:100%; height:100%;
    object-fit:cover;
  }

  .convo-body{flex:1;min-width:0;}
  .convo-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .convo-name{
    font-size:15px;
    font-weight:700;
  }
  .convo-time{
    font-size:11px;
    color:var(--sub);
    flex-shrink:0;
  }
  .convo-preview{
    font-size:13px;
    color:var(--sub);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .convo-chevron{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#c8c5bd;
  }

  @media (max-width:480px){
    body{ padding:0; }
    .app{
      max-width:100%;
      width:100%;
      height:100vh;
      height:100dvh;
      max-height:none;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
  }

  /* ---------- bottom icon bar ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid var(--line);
    background:#fff;
    padding:14px 0 max(14px, env(safe-area-inset-bottom));
  }
  .bottom-bar i{
    font-size:21px;
    color:var(--ink);
  }
</style>
</head>
<body>

<div class="app">
<div class="content">

  <div class="msg-header">
    <a class="back-btn" href="../">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      처음으로
    </a>

    <div class="profile-row">
      <div class="profile-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM4.5 20.5c0-3.6 3.4-6.5 7.5-6.5s7.5 2.9 7.5 6.5" stroke="#c23f5a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <img src="./assets/profile.jpg" alt="Message Archive" onerror="this.style.display='none';">
      </div>
      <div class="profile-text">
        <span class="profile-name">Message Archive</span>
        <span class="profile-sub">솔라가 남긴 메시지들을 모아두었어요.</span>
      </div>
    </div>

    <div class="thread-count">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="#c23f5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>총 3개의 대화</span>
    </div>
  </div>

  <div class="section-divider"></div>
  <div class="section-label">대화 목록</div>

  <nav class="list">
    <a class="convo" href="./bubble/">
      <div class="convo-icon icon-bubble"><img src="./assets/bubble-logo.png" alt="Bubble"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">Bubble</span>
        </div>
        <div class="convo-preview">그동안의 버블 메시지 모아보기</div>
      </div>
      <span class="convo-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="convo" href="./fromm/">
      <div class="convo-icon icon-fromm"><img src="./assets/fromm-logo.png" alt="FROMM"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">FROMM</span>
        </div>
        <div class="convo-preview">프롬에서 보낸 편지들 모아보기</div>
      </div>
      <span class="convo-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>

    <a class="convo" href="./memo/">
      <div class="convo-icon icon-memo"><img src="./assets/memo-logo.png" alt="용줄메모" onerror="this.onerror=null;this.src='./assets/memo-logo.jpg';"></div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-name">용줄메모</span>
        </div>
        <div class="convo-preview">한줄메모에 남긴 용선이만의 글 모아보기</div>
      </div>
      <span class="convo-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </nav>

</div>

<div class="bottom-bar">
  <i class="ti ti-user" aria-hidden="true"></i>
  <i class="ti ti-message-circle-2" aria-hidden="true"></i>
  <i class="ti ti-dots-vertical" aria-hidden="true"></i>
</div>

</div>

</body>
</html>
