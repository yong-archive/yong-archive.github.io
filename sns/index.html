<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar · SNS Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>  :root{    --page-bg:#ffffff;    --card-bg:#ffffff;    --ink:#161513;    --sub:#a3a19b;    --line:#e7e5e0;    --accent:#ff5b7a;  }  *{box-sizing:border-box;}  html,body{margin:0;padding:0;height:100%;}  a{text-decoration:none;color:inherit;}  body{    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;    color:var(--ink);    -webkit-font-smoothing:antialiased;    background:var(--page-bg);    min-height:100vh;    min-height:100dvh;    display:flex;    align-items:center;    justify-content:center;    padding:48px 20px;  }  .app{    width:100%;    max-width:380px;    height:676px;    max-height:calc(100vh - 96px);    max-height:calc(100dvh - 96px);    background:var(--card-bg);    border-radius:12px;    overflow:hidden;    box-shadow:0 0 12px rgba(0,0,0,.12);    border:0.5px solid #dedcd6;    display:flex;    flex-direction:column;  }  .content{    display:flex;    flex-direction:column;    width:100%;    margin:0;    max-height:100%;    overflow-y:auto;    scrollbar-width:thin;    scrollbar-color:rgba(0,0,0,.18) transparent;    padding:44px 20px 28px;  }  .content::-webkit-scrollbar{width:6px;}  .content::-webkit-scrollbar-track{background:transparent;}  .content::-webkit-scrollbar-thumb{background:#fff;border:1px solid rgba(0,0,0,.15);background-clip:padding-box;border-radius:999px;}  .content::-webkit-scrollbar-thumb:hover{background:#fff;border-color:rgba(0,0,0,.28);}  .header{ text-align:center; margin-bottom:45px; }  .back{    display:inline-flex;align-items:center;gap:4px;    font-size:12px;color:var(--sub);margin-bottom:64px;    text-align:left;width:100%;  }  .back svg{flex-shrink:0;}  .title{ font-size:20px; font-weight:700; color:#0e0d0c; }  .desc{    font-size:12px; color:var(--sub); margin-top:8px;    line-height:1.6;  }  .polaroid-grid{    display:grid;    grid-template-columns:repeat(2,minmax(0,1fr));    gap:18px 20px;    padding:0 14px;  }  .polaroid{    position:relative;    display:block;    background:#fff;    padding:6px 6px 0;    border-radius:2px;    box-shadow:0 2px 5px rgba(22,21,19,.09), 0 1px 2px rgba(22,21,19,.06);    transform:rotate(var(--rot));    transition:transform .15s ease, box-shadow .15s ease;  }  .polaroid:active{    transform:rotate(0deg) scale(1.05);    box-shadow:0 5px 12px rgba(22,21,19,.14);  }  .polaroid:nth-child(1){ --rot:-3deg; }  .polaroid:nth-child(2){ --rot:2.5deg; }  .polaroid:nth-child(3){ --rot:-2deg; }  .polaroid:nth-child(4){ --rot:3deg; }  .tape{    position:absolute;    top:-7px; left:50%;    width:40px; height:16px;    transform:translateX(-50%) rotate(-4deg);    opacity:.9;    border-radius:1px;  }  .polaroid.ig .tape{ background:#f2789f; }  .polaroid.wb .tape{ background:#ff8200; }  .polaroid.rn .tape{ background:#ff2442; }  .polaroid.dy .tape{ background:#2c2c2a; }  .photo{    width:100%;    aspect-ratio:1/1;    overflow:hidden;    background:#eeece7;  }  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }  .caption{    padding:7px 2px 9px;    text-align:center;  }  .site-name{    display:flex;    align-items:center;    justify-content:center;    gap:5px;    font-weight:500;    font-size:12.5px;    color:var(--sub);    line-height:1;  }  .site-name i{ font-size:12px; }  .polaroid.ig .site-name i{ color:#f2789f; }  .polaroid.wb .site-name i{ color:#ff8200; }  .polaroid.rn .site-name i{ color:#ff2442; }  .polaroid.dy .site-name i{ color:#2c2c2a; }  @media (max-width:480px){    body{ padding:0; }    .app{      max-width:100%;      width:100%;      height:100vh;      height:100dvh;      max-height:none;      border-radius:0;      border:none;      box-shadow:none;    }  }  </style>
</head>
<body>

<div class="app">
<div class="content">

  <div class="header">
    <a class="back" href="../">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      처음으로
    </a>
    <div class="title">SNS Archive</div>
    <div class="desc">솔라의 SNS 게시물 모음,<br>폴라로이드처럼 모아봤어요.</div>
  </div>

  <nav class="polaroid-grid">

    <a class="polaroid ig" href="./archive_instagram.html">
      <span class="tape"></span>
      <div class="photo"><img src="https://drive.google.com/thumbnail?id=1PejGGn3dIlgrCsGleIrkYoTVEHxLC92V&sz=w1000" loading="lazy" alt="Instagram 최근 게시물"></div>
      <div class="caption">
        <span class="site-name"><i class="ti ti-camera"></i>Instagram</span>
      </div>
    </a>

    <a class="polaroid wb" href="./archive_weibo.html">
      <span class="tape"></span>
      <div class="photo"><img src="https://drive.google.com/thumbnail?id=1sJorlR3LjP0V78nVFmmHs1CWO9KZ5eo4&sz=w1000" loading="lazy" alt="Weibo 최근 게시물"></div>
      <div class="caption">
        <span class="site-name"><i class="ti ti-compass"></i>Weibo</span>
      </div>
    </a>

    <a class="polaroid rn" href="./archive_rednote.html">
      <span class="tape"></span>
      <div class="photo"><img src="https://drive.google.com/thumbnail?id=1WOmbsCsYndGGWZDrI1EnN-PgU0ToWjhD&sz=w1000" loading="lazy" alt="RedNote 최근 게시물"></div>
      <div class="caption">
        <span class="site-name"><i class="ti ti-bookmark"></i>RedNote</span>
      </div>
    </a>

    <a class="polaroid dy" href="./archive_douyin.html">
      <span class="tape"></span>
      <div class="photo"><img src="https://drive.google.com/thumbnail?id=1qgdI3bDUI4Sj8twkSL7VZhsEWiVe-Dzp&sz=w1000" loading="lazy" alt="Douyin 최근 게시물"></div>
      <div class="caption">
        <span class="site-name"><i class="ti ti-brand-tiktok"></i>Douyin</span>
      </div>
    </a>
  </nav>

</div>
</div>

</body>
</html>
