<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용뚠, · Bubble Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="pwGate" style="position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;">
  <div style="font-size:28px;">🔒</div>
  <div style="font-size:14.5px;font-weight:700;color:#221F1C;">비밀번호를 입력하세요</div>
  <input id="pwInput" type="password" inputmode="numeric" placeholder="비밀번호" style="padding:10px 14px;border:1px solid #DEDAD2;border-radius:10px;font-size:14px;width:200px;text-align:center;outline:none;">
  <button id="pwSubmit" style="padding:9px 22px;border:none;border-radius:999px;background:#221F1C;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">확인</button>
  <div id="pwError" style="color:#E8556B;font-size:12px;visibility:hidden;">비밀번호가 틀렸습니다</div>
</div>

<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <button class="back">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="peer">
        <h1>용</h1>
      </div>
      <div class="icons">
        <button id="searchToggle" title="검색" style="border:none;background:none;padding:0;display:flex;cursor:pointer;color:inherit;">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="pink-banner">💗 <span>우리 다시 만날 수 있겠지?</span></div>
    <nav class="months" id="months" aria-label="월 선택"></nav>
    <nav class="days" id="days" aria-label="날짜 바로가기"></nav>
  </header>

  <main class="chat" id="chat">
    <div class="chat-inner" id="chatInner"></div>
    <button class="jump" id="jumpBtn" title="최신 메시지로">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </main>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-bar">
      <button class="search-back" id="searchClose" title="닫기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="searchInput" class="search-input" type="text" placeholder="대화 내용 검색" autocomplete="off">
      <button class="search-clear" id="searchClear" title="지우기" hidden>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.15"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

</div>

<script>
(function(){
  var PW = '910221';
  var gate = document.getElementById('pwGate');
  var input = document.getElementById('pwInput');
  var err = document.getElementById('pwError');

  function unlock(){
    sessionStorage.setItem('bubble_unlocked', '1');
    gate.style.display = 'none';
  }

  function tryUnlock(){
    if(input.value === PW){
      unlock();
    } else {
      err.style.visibility = 'visible';
      input.value = '';
      input.focus();
    }
  }

  if(sessionStorage.getItem('bubble_unlocked') === '1'){
    gate.style.display = 'none';
  } else {
    document.getElementById('pwSubmit').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
    setTimeout(function(){ input.focus(); }, 50);
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
